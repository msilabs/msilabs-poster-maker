<title>কোডপট</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;700&family=Baloo+Da+2:wght@400;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;700&family=Noto+Serif+Bengali:wght@400;700&family=Tiro+Bangla&family=JetBrains+Mono:wght@400;600&family=Fira+Code:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a two-part workbench — the four fields on the left, the poster on a "light table" on the right with size and theme right beside it. */
:root{
  --bg:#EEF1EF; --panel:#FFFFFF; --sunk:#F5F7F6; --ink:#16211E; --muted:#5A6A65; --line:#D8E0DC;
  --accent:#0E7A60; --accent-ink:#FFFFFF; --accent-soft:rgba(14,122,96,.10); --table:#DFE5E2; --danger:#B3261E;
  --f-ui:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  --f-display:"Anek Bangla","Hind Siliguri",system-ui,sans-serif;
  --f-code:"JetBrains Mono","Fira Code",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --panel:#151D1A; --sunk:#111816; --ink:#E5EEEA; --muted:#93A49E; --line:#263330;
  --accent:#3FCCA6; --accent-ink:#04231B; --accent-soft:rgba(63,204,166,.14); --table:#0A0F0D; --danger:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --panel:#151D1A; --sunk:#111816; --ink:#E5EEEA; --muted:#93A49E; --line:#263330;
  --accent:#3FCCA6; --accent-ink:#04231B; --accent-soft:rgba(63,204,166,.14); --table:#0A0F0D; --danger:#FF8A80; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 18px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.logo{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.01em}
.logo b{color:var(--accent);font-family:var(--f-code);font-size:17px;font-weight:600;margin-right:4px}
.sub{color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 16px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;padding-inline:22px}
.btn.primary:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.55;cursor:progress}

.work{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);grid-template-areas:"panel stage";min-height:calc(100vh - 66px)}
.panel{grid-area:panel;min-width:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px;
  padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.stage{grid-area:stage;min-width:0;background:var(--table);display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap;justify-content:center}
.seg button{border:none;background:none;border-radius:999px;padding:5px 14px;font-size:14px;color:var(--muted);font-weight:500}
.seg button small{font-family:var(--f-code);font-size:11px;margin-left:5px;opacity:.8}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
.canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;width:100%}
#poster{display:block;max-width:100%;max-height:calc(100vh - 220px);width:auto;height:auto;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.22);background:#000}
.dots{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);position:relative;padding:0}
.dot::after{content:"";position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--a);border:2px solid var(--panel)}
.dot[aria-checked="true"]{box-shadow:0 0 0 3px var(--accent)}
.dots .lbl{font-size:13px;color:var(--muted);margin-right:2px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.field input[type=text],.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px}
.field textarea{resize:vertical;min-height:80px}
.field textarea.code{font-family:var(--f-code);font-size:13px;line-height:1.55;min-height:240px;white-space:pre;overflow:auto;tab-size:2}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
code.k{font-family:var(--f-code);font-size:12px;background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1 1 140px}
.warnline{font-size:13px;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0}

details{border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
details>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";color:var(--muted);font-size:18px;line-height:1}
details[open]>summary::after{content:"–"}
details .inner{padding:4px 14px 14px;display:flex;flex-direction:column;gap:14px}
.toggles{display:flex;flex-wrap:wrap;gap:8px 18px}
.tg{display:flex;align-items:center;gap:8px;font-size:14px}
.tg input{accent-color:var(--accent);width:16px;height:16px}
.accentRow{display:flex;align-items:center;gap:10px}
.accentRow input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:2px}
input[type=range]{accent-color:var(--accent);width:100%}
.ib{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 10px;font-size:13px}
.ib:hover{border-color:var(--accent)}
.ib.warn{color:var(--danger)}
.ib.warn.arm{background:var(--danger);color:#fff;border-color:var(--danger)}

.lib{display:flex;flex-direction:column;gap:8px}
.libitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.libitem[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.libitem .t{flex:1;min-width:0}
.libitem .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:14px}
.libitem .t small{color:var(--muted);font-size:12px}
.note{font-size:13px;color:var(--muted);margin:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--panel);border-radius:14px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal img{width:100%;border-radius:6px;border:1px solid var(--line)}
.modal h3{margin:0;font-family:var(--f-display)}

@media (max-width:860px){
  .work{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "panel"}
  .panel{border-right:none;border-top:1px solid var(--line)}
  #poster{max-height:64vh}
}
</style>

<header class="bar">
  <div class="brand"><span class="logo"><b>&lt;/&gt;</b>কোডপট</span><span class="sub">msilabs পোস্টের পোস্টার</span></div>
  <div class="actions">
    <button class="btn" id="btnCopy" type="button">কপি</button>
    <button class="btn primary" id="btnSave" type="button">ছবি সেভ করুন</button>
  </div>
</header>

<main class="work">
  <section class="stage" aria-label="প্রিভিউ">
    <div class="seg" id="sizes" role="radiogroup" aria-label="ছবির মাপ"></div>
    <div class="canvasWrap"><canvas id="poster" width="1080" height="1350" aria-label="পোস্টারের প্রিভিউ"></canvas></div>
    <div class="dots" id="themes" role="radiogroup" aria-label="থিম"><span class="lbl">থিম</span></div>
  </section>

  <aside class="panel">
    <div class="field">
      <label for="fTitle">শিরোনাম</label>
      <input type="text" id="fTitle">
    </div>
    <div class="field">
      <label for="fBody">ব্যাখ্যা <span class="hint">· <code class="k">`কোড`</code> আর <code class="k">**বোল্ড**</code> চলবে</span></label>
      <textarea id="fBody" rows="3"></textarea>
    </div>
    <div class="field">
      <label for="fCode">কোড <span class="hint">· খালি রাখলে শুধু লেখার পোস্টার হবে</span></label>
      <textarea id="fCode" class="code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    </div>
    <div class="row">
      <div class="field">
        <label for="fLang">ভাষা</label>
        <select id="fLang"></select>
      </div>
      <div class="field">
        <label for="fTag">ট্যাগ <span class="hint">· ঐচ্ছিক</span></label>
        <input type="text" id="fTag" placeholder="যেমন JavaScript টিপস">
      </div>
    </div>
    <p class="warnline" id="codeNote" hidden></p>

    <details id="more">
      <summary>আরও সেটিং</summary>
      <div class="inner">
        <div class="field">
          <label for="fFile">ফাইলের নাম <span class="hint">· কোডের জানালার মাথায়</span></label>
          <input type="text" id="fFile" placeholder="যেমন app.js">
        </div>
        <div class="row">
          <div class="field">
            <label for="dFontBn">বাংলা ফন্ট</label>
            <select id="dFontBn"></select>
          </div>
          <div class="field">
            <label for="dFontCode">কোডের ফন্ট</label>
            <select id="dFontCode"></select>
          </div>
        </div>
        <div class="field">
          <label for="dCodeSize">কোডের আকার: <span id="dCodeSizeVal"></span></label>
          <input type="range" id="dCodeSize" min="0" max="40" step="1">
          <span class="hint">০ মানে নিজে থেকে মাপমতো হবে</span>
        </div>
        <div class="field">
          <span class="lbl">অ্যাকসেন্ট রং</span>
          <div class="accentRow">
            <input type="color" id="dAccent" aria-label="অ্যাকসেন্ট রং">
            <button class="ib" id="dAccentReset" type="button">থিমের রং</button>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="dHandle">পেজের নাম</label>
            <input type="text" id="dHandle">
          </div>
          <div class="field">
            <label for="dFooter">নিচের লেখা</label>
            <input type="text" id="dFooter">
          </div>
        </div>
        <div class="toggles">
          <label class="tg"><input type="checkbox" id="tLine">লাইন নম্বর</label>
          <label class="tg"><input type="checkbox" id="tChrome">জানালার বোতাম</label>
        </div>
      </div>
    </details>

    <details id="libBox">
      <summary>আগের পোস্টার</summary>
      <div class="inner">
        <div class="row">
          <button class="btn primary" id="libNew" type="button">+ নতুন পোস্টার</button>
        </div>
        <p class="note">প্রতিটা পোস্টার লেখার সাথে সাথে এই ব্রাউজারে জমা থাকে। নতুন পোস্টারে ডিজাইন আগেরটার মতোই থাকে।</p>
        <div class="lib" id="libList"></div>
      </div>
    </details>
  </aside>
</main>

<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden>
  <div class="box">
    <h3>ছবি সেভ করুন</h3>
    <p class="note">এখানে সরাসরি ডাউনলোড চালু নেই। ছবিতে রাইট-ক্লিক (ফোনে লম্বা চাপ) দিয়ে সেভ করুন।</p>
    <img id="modalImg" alt="পোস্টারের ছবি">
    <div><button class="btn" id="modalClose" type="button">বন্ধ করুন</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dart.min.js"></script>
<script>
(() => {
"use strict";

/* ---------- constants ---------- */
const SIZES = {
  square:   {w:1080,h:1080,label:"বর্গ",ratio:"১:১"},
  portrait: {w:1080,h:1350,label:"পোর্ট্রেট",ratio:"৪:৫"},
  wide:     {w:1200,h:630, label:"চওড়া",ratio:"১.৯:১"}
};
const BN_FONTS = {
  "Hind Siliguri":     {title:700,bold:600,body:400,label:"হিন্দ শিলিগুড়ি"},
  "Anek Bangla":       {title:700,bold:600,body:400,label:"অনেক বাংলা"},
  "Baloo Da 2":        {title:700,bold:600,body:400,label:"বালু দা"},
  "Noto Sans Bengali": {title:700,bold:700,body:400,label:"নোটো সান্স বাংলা"},
  "Noto Serif Bengali":{title:700,bold:700,body:400,label:"নোটো সেরিফ বাংলা"},
  "Tiro Bangla":       {title:400,bold:400,body:400,label:"তিরো বাংলা"}
};
const CODE_FONTS = ["JetBrains Mono","Fira Code","IBM Plex Mono"];
const LANGS = [
  ["auto","নিজে বুঝে নিক"],["javascript","JavaScript"],["typescript","TypeScript"],["python","Python"],
  ["java","Java"],["cpp","C++"],["c","C"],["csharp","C#"],["go","Go"],["rust","Rust"],["php","PHP"],
  ["kotlin","Kotlin"],["swift","Swift"],["dart","Dart"],["ruby","Ruby"],["sql","SQL"],["bash","Bash / Shell"],
  ["xml","HTML / XML"],["css","CSS"],["scss","SCSS"],["json","JSON"],["yaml","YAML"],["markdown","Markdown"],["plaintext","সাধারণ লেখা"]
];
const LANG_LABEL = Object.fromEntries(LANGS);
const THEMES = {
  night:{name:"রাত",bg1:"#0B1220",bg2:"#1B2643",dot:"#FFFFFF",fg:"#F2F5FB",muted:"#9AA6BF",accent:"#FFB547",onAccent:"#1A1206",
    card:"#090F1D",cardLine:"rgba(255,255,255,0.09)",shadow:"rgba(0,0,0,0.5)",gutter:"#3D4863",
    syn:{fg:"#E3E9F4",kw:"#FF7AB6",str:"#A6E07A",num:"#FFB547",com:"#6A7794",fn:"#7CC7FF",type:"#C9A2FF",bi:"#5EE0D0",attr:"#FFD58A",tag:"#FF7AB6",meta:"#8FA0BF",punc:"#9AA6BF"}},
  emerald:{name:"পান্না",bg1:"#05261F",bg2:"#0C4D41",dot:"#B8FFF0",fg:"#ECFBF6",muted:"#93C2B5",accent:"#5EEAD4",onAccent:"#032620",
    card:"#031A16",cardLine:"rgba(94,234,212,0.16)",shadow:"rgba(0,0,0,0.45)",gutter:"#2A5A50",
    syn:{fg:"#DDF4EE",kw:"#F9A8D4",str:"#BEF264",num:"#FDBA74",com:"#5E8C80",fn:"#7DD3FC",type:"#C4B5FD",bi:"#5EEAD4",attr:"#FDE68A",tag:"#F9A8D4",meta:"#7FA99D",punc:"#93C2B5"}},
  dawn:{name:"ভোর",bg1:"#EEF3FA",bg2:"#D6E2F4",dot:"#1B2A44",fg:"#0F1A2E",muted:"#4A5873",accent:"#2457D6",onAccent:"#FFFFFF",
    card:"#FFFFFF",cardLine:"rgba(15,26,46,0.10)",shadow:"rgba(30,50,90,0.20)",gutter:"#B6C0D0",light:true,
    syn:{fg:"#1F2937",kw:"#C0287A",str:"#15803D",num:"#B45309",com:"#8A94A6",fn:"#1D4ED8",type:"#7C3AED",bi:"#0E7490",attr:"#A16207",tag:"#C0287A",meta:"#64748B",punc:"#475569"}},
  dusk:{name:"গোধূলি",bg1:"#22101B",bg2:"#4D1B2B",dot:"#FFD9CC",fg:"#FFF1EC",muted:"#D3A7A0",accent:"#FF9466",onAccent:"#2A0E05",
    card:"#16080F",cardLine:"rgba(255,148,102,0.16)",shadow:"rgba(0,0,0,0.5)",gutter:"#5C3440",
    syn:{fg:"#F7E4DE",kw:"#FF8FB1",str:"#C8E68C",num:"#FFC27A",com:"#8A6670",fn:"#8FD3FF",type:"#E0B3FF",bi:"#FFB4A2",attr:"#FFD9A0",tag:"#FF8FB1",meta:"#B48C92",punc:"#D3A7A0"}},
  ink:{name:"কালি",bg1:"#131313",bg2:"#232323",dot:"#FFFFFF",fg:"#FAFAFA",muted:"#A3A3A3",accent:"#FACC15",onAccent:"#141414",
    card:"#0A0A0A",cardLine:"rgba(255,255,255,0.10)",shadow:"rgba(0,0,0,0.55)",gutter:"#3A3A3A",
    syn:{fg:"#E5E5E5",kw:"#FACC15",str:"#D4D4D4",num:"#FACC15",com:"#6B6B6B",fn:"#FFFFFF",type:"#FFFFFF",bi:"#E5E5E5",attr:"#BDBDBD",tag:"#FACC15",meta:"#8A8A8A",punc:"#8A8A8A"}}
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const bn = n => String(n).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const seg = (typeof Intl !== "undefined" && Intl.Segmenter) ? new Intl.Segmenter("bn", {granularity:"grapheme"}) : null;
const graphemes = s => seg ? Array.from(seg.segment(s), x => x.segment) : Array.from(s);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const clone = o => JSON.parse(JSON.stringify(o));
function rgba(hex, a){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return hex;
  const n = parseInt(m[1], 16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}
function rr(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

for (const [k, v] of Object.entries(BN_FONTS)) { const o = document.createElement("option"); o.value = k; o.textContent = v.label; dFontBn.append(o); }
const dFontCode = $("dFontCode");
CODE_FONTS.forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = k; dFontCode.append(o); });
const D = {fontBn: dFontBn, fontCode: dFontCode, handle: $("dHandle"), footer: $("dFooter")};
for (const k in D) D[k].addEventListener("input", () => { state[k] = D[k].value; schedule(); persist(); });
const T = {showLineNo: $("tLine"), showChrome: $("tChrome")};
for (const k in T) T[k].addEventListener("change", () => { state[k] = T[k].checked; schedule(); persist(); });
$("dCodeSize").addEventListener("input", e => { state.codeSize = +e.target.value; syncAll(); schedule(); persist(); });
$("dAccent").addEventListener("input", e => { state.accent = e.target.value; schedule(); persist(); });
$("dAccentReset").addEventListener("click", () => { state.accent = null; syncAll(); schedule(); persist(); });

function syncAll(){
  for (const k in F) F[k].value = state[k] || (k === "lang" ? "auto" : "");
  for (const k in D) D[k].value = state[k] ?? "";
  for (const k in T) T[k].checked = !!state[k];
  sizeBox.querySelectorAll("button").forEach(b => b.setAttribute("aria-checked", b.dataset.k === state.size ? "true" : "false"));
  themeBox.querySelectorAll(".dot").forEach(b => b.setAttribute("aria-checked", b.dataset.k === state.theme ? "true" : "false"));
  $("dAccent").value = state.accent || THEMES[state.theme].accent;
  $("dCodeSize").value = state.codeSize || 0;
  $("dCodeSizeVal").textContent = state.codeSize ? bn(state.codeSize) : "নিজে থেকে";
}

/* ---------- earlier posters ---------- */
const fmtDate = ts => { try { return new Date(ts).toLocaleDateString("bn-BD", {day: "numeric", month: "long"}); } catch { return ""; } };
function armed(btn, label, fn){
  btn.addEventListener("click", () => {
    if (btn.dataset.arm === "1") { clearTimeout(btn._t); fn(); return; }
    btn.dataset.arm = "1"; const old = btn.textContent; btn.textContent = label; btn.classList.add("arm");
    btn._t = setTimeout(() => { btn.dataset.arm = ""; btn.textContent = old; btn.classList.remove("arm"); }, 3000);
  });
}
function renderLib(){
  const box = $("libList"); box.textContent = "";
  library.forEach(p => {
    const row = document.createElement("div"); row.className = "libitem"; row.setAttribute("aria-current", p.id === state.id ? "true" : "false");
    const tx = document.createElement("div"); tx.className = "t";
    const b = document.createElement("b"); b.textContent = p.title || "শিরোনাম নেই";
    const sm = document.createElement("small"); sm.textContent = (p.id === state.id ? "খোলা আছে · " : "") + fmtDate(p.updated);
    tx.append(b, sm); row.append(tx);
    if (p.id !== state.id) {
      const o = document.createElement("button"); o.className = "ib"; o.type = "button"; o.textContent = "খুলুন";
      o.addEventListener("click", () => loadPost(p.id));
      const d = document.createElement("button"); d.className = "ib warn"; d.type = "button"; d.textContent = "মুছুন";
      armed(d, "নিশ্চিত?", () => { library = library.filter(x => x.id !== p.id); store.set("kodpot.posters", library); renderLib(); toast("পোস্টার মুছে ফেলা হয়েছে"); });
      row.append(o, d);
    }
    box.append(row);
  });
}
$("libBox").addEventListener("toggle", () => { if ($("libBox").open) renderLib(); });
function loadPost(id){
  clearTimeout(saveTimer); commit();
  const p = library.find(x => x.id === id); if (!p) return;
  state = clone(p); store.set("kodpot.currentPoster", id);
  syncAll(); schedule(); renderLib(); toast("পোস্টার খোলা হয়েছে");
}
$("libNew").addEventListener("click", () => {
  clearTimeout(saveTimer); commit();
  const p = {id: uid(), updated: Date.now(), tag: "", title: "পোস্টের শিরোনাম লিখুন", body: "এখানে ছোট করে ব্যাখ্যা লিখুন।", code: "// এখানে আপনার কোড পেস্ট করুন", lang: "auto", file: ""};
  DESIGN_KEYS.forEach(k => p[k] = state[k]);
  state = p; commit(); syncAll(); schedule();
  F.title.focus(); F.title.select();
  toast("নতুন পোস্টার শুরু হলো, ডিজাইন আগেরটার মতো রাখা হয়েছে");
});

/* ---------- save / copy ---------- */
let toastT;
function toast(msg){ const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3200); }
let downloadsP = null;
const getDownloads = () => downloadsP || (downloadsP = (async () => { try { return window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch { return null; } })());
getDownloads();
const fileName = () => "msilabs-" + ((state.title || "poster").trim().replace(/[\\/:*?"<>|`(){}\[\]]+/g, "").replace(/\s+/g, "-").slice(0, 40) || "poster") + ".png";
const toBlob = c => new Promise(r => c.toBlob(r, "image/png"));
function freshCanvas(){ const c = document.createElement("canvas"); renderPoster(c); return c; }
function showFallback(c){ $("modalImg").src = c.toDataURL("image/png"); $("modal").hidden = false; $("modalClose").focus(); }

$("btnSave").addEventListener("click", async () => {
  const btn = $("btnSave"); if (btn.disabled) return; btn.disabled = true;
  try {
    await ensureFonts();
    const c = freshCanvas(), name = fileName();
    const dl = await getDownloads();
    if (!dl) { showFallback(c); return; }
    try { await dl.save({filename: name, data: await toBlob(c)}); toast("ছবি সেভ হয়েছে"); }
    catch (e) {
      const code = e && e.code;
      if (code === "declined") toast("সেভ বাতিল করা হয়েছে");
      else if (code === "rate_limited") toast("আগের সেভের জানালা এখনো খোলা, একটু পরে আবার চাপুন");
      else showFallback(c);
    }
  } catch (e) { console.error(e); toast("ছবি বানাতে সমস্যা হলো, আবার চেষ্টা করুন"); }
  finally { btn.disabled = false; }
});
$("btnCopy").addEventListener("click", () => {
  const fail = () => toast("এখানে ছবি কপি করা যাচ্ছে না, “ছবি সেভ করুন” ব্যবহার করুন");
  try {
    if (!navigator.clipboard || !window.ClipboardItem) return fail();
    navigator.clipboard.write([new ClipboardItem({"image/png": toBlob(freshCanvas())})])
      .then(() => toast("ছবি কপি হয়েছে, পোস্টে পেস্ট করুন")).catch(fail);
  } catch { fail(); }
});
$("modalClose").addEventListener("click", () => $("modal").hidden = true);
$("modal").addEventListener("click", e => { if (e.target === $("modal")) $("modal").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("modal").hidden = true; });

/* ---------- boot ---------- */
syncAll(); doRender();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fontsKey = ""; schedule(); });
})();
</script>
